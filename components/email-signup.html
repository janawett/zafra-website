<!--
  ZAFRA — REUSABLE EMAIL SIGNUP COMPONENT
  ========================================
  Netlify Forms, no third-party service, no page reload (AJAX via fetch).

  This site has no build step / templating, so this component is a
  copy-paste partial rather than an include. To use it on any page:

    1. Paste the <style> block into that page's <head> (inside its
       existing <style> tag — skip if the page already includes these
       rules, e.g. index.html has this component live already).
    2. Paste the <section>...</section> markup wherever the form should
       appear on the page.
    3. Paste the <script> block just before </body> (or add its contents
       to a script tag the page already has). Only needs to run once per
       page even if you never add the form twice on it.

  IMPORTANT — Netlify setup required outside this repo:
    - Netlify only detects a form if data-netlify="true" and a matching
      hidden "form-name" input are present in the *static* HTML actually
      deployed (true here — nothing is injected by JS). It only needs to
      appear on ONE deployed page for Netlify to register the form site-
      wide; it's already live on index.html, so you do not have to paste
      this on every page for submissions to work — only where you want
      the form to visually appear.
    - Form notification email: this cannot be set from code. In the
      Netlify dashboard: Site settings → Forms → Form notifications →
      Add notification → Email notification → hello@zafrasalt.com,
      pointing at the "zafra-launch-signup" form.
-->

<style>
  /* Uses the site's existing tokens — safe to skip if already defined
     on the page: --bg, --dark, --body-text, --kraft, --accent */

  .signup-section { padding: 90px 0; }

  .signup-title { margin-bottom: 32px; }

  .signup-form {
    display: flex;
    gap: 12px;
    max-width: 440px;
    margin: 0 auto;
  }

  .signup-input {
    flex: 1;
    min-width: 0;
    padding: 15px 18px;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    color: var(--body-text);
    background: var(--bg);
    border: 1px solid var(--kraft);
    border-radius: 2px;
  }

  .signup-input:focus { outline: none; border-color: var(--accent); }

  .signup-submit {
    background: var(--dark);
    color: var(--bg);
    padding: 15px 28px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s ease;
  }

  .signup-submit:hover { background: var(--accent); }

  .signup-success {
    display: none;
    max-width: 440px;
    margin: 20px auto 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--accent);
  }

  .signup-success.visible { display: block; }

  .signup-form.hidden { display: none; }

  @media (max-width: 480px) {
    .signup-form { flex-direction: column; }
  }
</style>

<!-- ============ EMAIL SIGNUP ============ -->
<section class="section signup-section section-sand">
  <div class="container">
    <h2 class="section-title signup-title">Zafra launches soon. Be the first to know.</h2>

    <form name="zafra-launch-signup" method="POST" data-netlify="true" class="signup-form" id="zafra-signup-form">
      <input type="hidden" name="form-name" value="zafra-launch-signup">
      <input type="email" name="email" class="signup-input" placeholder="Enter your email" aria-label="Email address" required>
      <button type="submit" class="signup-submit">Notify Me</button>
    </form>

    <p class="signup-success" id="signup-success" role="status">You're on the list. We'll let you know when Zafra is available.</p>
  </div>
</section>

<script>
  // Email signup — Netlify Forms, AJAX submit (no page reload)
  // Safe to include once per page even without the form present.
  (function () {
    const signupForm = document.getElementById('zafra-signup-form');
    const signupSuccess = document.getElementById('signup-success');
    if (!signupForm) return;

    function encodeFormData(data) {
      return Object.keys(data)
        .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(data[key]))
        .join('&');
    }

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = signupForm.email.value;

      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: encodeFormData({ 'form-name': 'zafra-launch-signup', email })
      })
        .then(() => {
          signupForm.classList.add('hidden');
          signupSuccess.classList.add('visible');
        })
        .catch((error) => {
          console.error('Signup form error:', error);
          alert('Something went wrong. Please try again.');
        });
    });
  })();
</script>
